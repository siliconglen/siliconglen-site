<header class="site-header">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Siliconglen, Craig Cockburn — home">
      <strong>SILICONGLEN</strong><span>Craig Cockburn</span>
    </a>
    <nav aria-label="Primary navigation">
      <ul class="nav-list">
        {% for item in site.data.navigation %}
          <li>
            {% if item.children %}
              <details>
                <summary>{{ item.label }}</summary>
                <ul>
                  {% for child in item.children %}
                    <li><a href="{{ child.url | relative_url }}">{{ child.label }}</a></li>
                  {% endfor %}
                </ul>
              </details>
            {% else %}
              <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a>
            {% endif %}
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
