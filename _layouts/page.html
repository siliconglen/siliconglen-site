---
layout: default
---
<header class="page-header">
  <div class="wrapper">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="lede">{{ page.intro }}</p>{% endif %}
    {% if page.image %}
      <figure class="photo-placeholder page-header__image">
        <div class="photo-frame photo-frame--wide">
          <img src="{{ page.image }}" alt="{{ page.image_alt | default: 'Temporary generic stock photo, to be replaced before launch' }}" loading="eager">
        </div>
        <figcaption>Temporary stock photo, real photography to follow</figcaption>
      </figure>
    {% endif %}
  </div>
</header>
<article class="wrapper prose">
  {{ content }}
</article>
