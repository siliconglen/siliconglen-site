<!doctype html>
<html lang="{{ site.lang | default: 'en-GB' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% if page.redirect_to %}
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    {% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="af359a4b-f40e-4f05-8d9c-3f469f90b751" data-domains="siliconglen.com,www.siliconglen.com"></script>
  </head>
  <body>
    {% include header.html %}
    <main id="main-content" tabindex="-1">{{ content }}</main>
    {% include footer.html %}
    <script src="{{ '/assets/js/navigation.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/reveal.js' | relative_url }}" defer></script>
  </body>
</html>
